openapi: 3.0.3
info:
  title: Change Password API
  description: API for updating user passwords.
  version: 1.0.0
servers:
  - url: https://api.cabsystem.com/v1
paths:
  /users/change-password:
    post:
      summary: Change account password
      operationId: changePassword
      tags:
        - User Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: OldPassword123!
                new_password:
                  type: string
                  format: password
                  example: NewSecurePassword456!
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Incorrect current password or weak new password
        '401':
          description: Unauthorized
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
